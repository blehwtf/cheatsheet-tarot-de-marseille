name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true   # runs bundle install and caches gems

      - name: RuboCop
        run: bundle exec rubocop

      - name: nanoc compile
        run: bundle exec nanoc compile

      - name: nanoc check fs
        run: bundle exec nanoc check fs

      - name: nanoc check css
        run: bundle exec nanoc check css
