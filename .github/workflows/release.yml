name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for conventional commit scanning

      - uses: blehwtf/.github/.github/actions/semantic-version@main
        with:
          tag-prefix: v
          version-file: none  # no package.json / VERSION file in this repo
          create-release: true
