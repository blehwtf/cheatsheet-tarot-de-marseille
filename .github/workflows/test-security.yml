name: test-security

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC

permissions:
  contents: read
  security-events: write  # for uploading SARIF to GitHub Security tab

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4

      - name: SAST — Ruby & secrets
        run: |
          semgrep ci \
            --config p/ruby \
            --config p/security-audit \
            --config p/secrets \
            --sarif --output semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: SCA — dependency vulnerabilities
        run: |
          semgrep ci \
            --config p/ruby-gems \
            --sarif --output semgrep-sca.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast

      - name: Upload SCA SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-sca.sarif
          category: semgrep-sca
